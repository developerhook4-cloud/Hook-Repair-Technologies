# CI de Hook Repair: formato, vet, build y pruebas (incluye integracion con MySQL).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones viejas de la misma rama/PR cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      # La version de Go sale de go.mod (misma que usa Railway).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formato (corre gofmt -w):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Las pruebas de integracion crean y borran su propia base hook_test_*.
      - name: go test
        env:
          HOOK_TEST_MYSQL: root:root@tcp(127.0.0.1:3306)/
        run: go test ./... -count=1 -timeout 10m

      # Informativo: no bloquea el CI si falla (red, base de vulnerabilidades, etc.).
      - name: govulncheck
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
