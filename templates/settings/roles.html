{{define "settings-roles"}}{{template "layout-start" .}}
<div id="scrollContainer" class="flex-1 min-h-0 flex flex-col bg-white rounded-2xl p-6 md:p-10 shadow-sm overflow-y-auto relative scroll-smooth">
  <div class="w-full flex flex-col flex-1">
    <h2 class="heading-5 mb-8">Roles, permisos y accesos.</h2>

    <div class="flex flex-wrap items-stretch gap-4 mb-8" id="tabs">
      <div data-tab="roles" role="button" tabindex="0" class="rounded-lg py-2 px-4 w-72 flex flex-col justify-center cursor-pointer transition-colors">
        <h4 class="label-normal font-bold">Roles</h4>
        <p class="text-xs mt-1 whitespace-nowrap overflow-hidden text-ellipsis">Configuración de roles.</p>
      </div>
      <div data-tab="permisos" role="button" tabindex="0" class="rounded-lg py-2 px-4 w-72 flex flex-col justify-center cursor-pointer transition-colors">
        <h4 class="label-normal font-bold">Permisos</h4>
        <p class="text-xs mt-1 whitespace-nowrap overflow-hidden text-ellipsis">Controlar a que pueda acceder cada rol.</p>
      </div>
    </div>

    {{/* Pestaña Roles */}}
    <section id="tabRoles" class="flex flex-col flex-1">
      <div class="border border-gray-200 rounded-[20px] bg-white flex flex-col mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center p-6 gap-4 border-b border-gray-200">
          <div class="relative w-full md:w-80">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="searchRoles" type="text" placeholder="Buscar rol..." autocomplete="off"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:border-brand-primary body-normal text-dark-1 placeholder-gray-400" />
          </div>
          <button id="addRoleBtn" type="button" class="w-full md:w-auto bg-brand-primary text-white px-6 py-2.5 rounded-lg label-normal font-bold flex items-center justify-center gap-2 hover:opacity-90 transition-opacity shadow-sm">
            <i class="fa-solid fa-plus text-xs"></i> Agregar nuevo rol
          </button>
        </div>
        <div id="rolesList" class="flex flex-col w-full px-6"></div>
      </div>
      <div id="pager"></div>
    </section>

    {{/* Pestaña Permisos */}}
    <section id="tabPerms" class="flex flex-col flex-1" hidden>
      <div class="border border-gray-200 rounded-[20px] bg-white flex flex-col mb-6">
        <div class="flex flex-col md:flex-row justify-between items-center p-6 gap-4 border-b border-gray-200">
          <div class="relative w-full md:w-87.5">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input id="searchPerms" type="text" placeholder="Buscar permisos (inventario, pos, rec...)" autocomplete="off"
                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:border-brand-primary body-normal text-dark-1 placeholder-gray-400" />
          </div>
          <div id="ddRole" class="md:w-56"></div>
        </div>
        <div id="permsList" class="flex flex-col w-full p-6 gap-3"></div>
      </div>
      <div class="mt-auto pt-2 flex justify-end items-center gap-4 w-full">
        <button id="cancelPerms" type="button" class="px-6 py-2.5 rounded-lg bg-gray-100 text-dark-2 font-bold label-normal hover:bg-gray-200 transition-colors">Cancelar</button>
        <button id="savePerms" type="button" class="px-6 py-2.5 rounded-lg bg-brand-primary text-white font-bold label-normal hover:opacity-90 transition-opacity shadow-sm disabled:opacity-50">Guardar cambios</button>
      </div>
    </section>
  </div>
</div>
{{template "layout-end" .}}{{end}}
