{{define "settings-roles"}}{{template "layout-start" .}}
<div id="scrollContainer" class="page-card">
  <div class="page-card__inner">
    <h2 class="heading-5 page-title">Roles, permisos y accesos.</h2>

    <div class="role-tabs" id="tabs">
      <div data-tab="roles" role="button" tabindex="0" class="role-tab">
        <h4 class="label-normal role-tab__title">Roles</h4>
        <p class="role-tab__text">Configuración de roles.</p>
      </div>
      <div data-tab="permisos" role="button" tabindex="0" class="role-tab">
        <h4 class="label-normal role-tab__title">Permisos</h4>
        <p class="role-tab__text">Controlar a que pueda acceder cada rol.</p>
      </div>
    </div>

    {{/* Pestaña Roles */}}
    <section id="tabRoles" class="role-section">
      <div class="role-panel">
        <div class="role-panel__bar">
          <div class="search-box search-box--compact">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchRoles" type="text" placeholder="Buscar rol..." autocomplete="off" />
          </div>
          <button id="addRoleBtn" type="button" class="btn btn--primary role-panel__add">
            <i class="fa-solid fa-plus"></i> Agregar nuevo rol
          </button>
        </div>
        <div id="rolesList" class="roles-list"></div>
      </div>
      <div id="pager"></div>
    </section>

    {{/* Pestaña Permisos */}}
    <section id="tabPerms" class="role-section" hidden>
      <div class="role-panel">
        <div class="role-panel__bar">
          <div class="search-box search-box--compact search-box--perms">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchPerms" type="text" placeholder="Buscar permisos (inventario, pos, rec...)" autocomplete="off" />
          </div>
          <div id="ddRole" class="role-panel__select"></div>
        </div>
        <div id="permsList" class="perms-list"></div>
      </div>
      <div class="perms-actions">
        <button id="cancelPerms" type="button" class="btn btn--soft">Cancelar</button>
        <button id="savePerms" type="button" class="btn btn--primary">Guardar cambios</button>
      </div>
    </section>
  </div>
</div>
{{template "layout-end" .}}{{end}}
