{{define "login"}}{{template "head" .}}
<body>
<div class="login">
  <div class="login__side">
    <div>
      <img src="/static/img/LOGO_RN.svg" alt="Hook Technologies" class="login__logo" />
    </div>

    <div class="login__box">
      <div class="login__header">
        <h1 class="heading-3">Login</h1>
        <p class="body-normal login__subtitle">Por favor introduzca sus credenciales para iniciar sesión.</p>
      </div>

      <form id="loginForm" class="login__form" novalidate>
        <div class="form-field">
          <label for="email" class="label-normal form-field__label">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="Introduzca su email" required class="form-field__input" />
          <small data-error-for="email" class="label-small form-field__error" hidden></small>
        </div>

        <div class="form-field">
          <label for="password" class="label-normal form-field__label">Contraseña</label>
          <div class="form-field__control">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="*****************" required
                   class="form-field__input form-field__input--password" />
            <button type="button" data-toggle-password aria-label="Mostrar contraseña" class="form-field__eye">
              <i class="fa-solid fa-eye-slash"></i>
            </button>
          </div>
          <small data-error-for="password" class="label-small form-field__error" hidden></small>
        </div>

        <p id="loginError" class="label-normal login__error" hidden></p>

        <button id="loginSubmit" type="submit" disabled class="btn btn--dark btn--lg btn--block login__submit">Iniciar sesión</button>
      </form>
    </div>

    <p class="body-normal login__footer">© 2026 Hook Technologies</p>
  </div>

  <div class="login__art">
    <div class="login__art-card">
      <img src="/static/img/LOGO_BB.svg" alt="Hook Technologies" />
    </div>
  </div>
</div>
<script src="/static/js/core/api.js"></script>
<script src="/static/js/core/ui.js"></script>
<script src="/static/js/auth/login.js"></script>
</body>
</html>
{{end}}
