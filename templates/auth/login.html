{{define "login"}}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Hook Repair</title>
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
  <link rel="preload" href="/static/fonts/Mulish-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/auth/login.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <img src="/static/img/LOGO_RN.svg" alt="Hook Technologies">
    </div>
    <div class="login-eyebrow">Panel de administración</div>
    <h1 class="login-title">Bienvenido de vuelta</h1>
    <p class="login-sub">Inicia sesión para continuar</p>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <label for="email">Correo electrónico</label>
        <div class="login-field__input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <div class="login-field__input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          {{/* Ojo animado: parpadea al tocarlo y una línea lo tacha cuando la contraseña se ve. */}}
          <button type="button" class="login-field__toggle pw-eye" id="passwordToggle" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <g class="pw-eye-ball">
                <path class="pw-eye-shape" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
                <circle class="pw-eye-pupil" cx="12" cy="12" r="3"/>
              </g>
              <path class="pw-eye-slash" d="M3 3l18 18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="login-error" id="loginError" role="alert"></div>
      <button type="submit" id="loginSubmit" class="login-btn">INICIAR SESIÓN</button>
    </form>
  </div>
  <p class="login-foot">© 2026 Hook Technologies</p>
</div>

<script src="/static/js/core/api.js"></script>
<script src="/static/js/auth/login.js"></script>
</body>
</html>
{{end}}
