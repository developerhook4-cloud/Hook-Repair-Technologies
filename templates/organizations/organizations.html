{{define "organizations"}}{{template "app-start" .}}
<div class="h-screen pt-20 md:pt-24 bg-light-2 p-4 md:p-6 flex flex-col md:flex-row gap-6">
  <div class="flex-1 flex gap-6 overflow-y-auto">
    <div id="orgListPanel" class="bg-light-4 rounded-2xl p-6 md:p-8 shadow-card flex flex-col h-full transition-all duration-300 overflow-hidden w-full">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
        <div>
          <h2 class="heading-6 font-bold text-dark-1">Organizaciones</h2>
        </div>
        <div class="flex w-full sm:w-auto gap-3">
          <div class="relative flex-1 sm:w-64">
            <input id="search" type="text" placeholder="Buscar por nombre o correo..." autocomplete="off"
                   class="w-full bg-white border border-light-2 rounded-lg p-3 pl-10 body-normal text-dark-1 outline-none focus:border-brand-primary transition-colors placeholder:text-dark-4" />
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-dark-3"></i>
          </div>
          {{if .Can "Organizations.Update"}}
          <button id="addOrgBtn" type="button" class="label-large py-3.5 rounded-lg transition-colors shadow-small px-4 bg-brand-primary hover:bg-brand-darker text-light-4 whitespace-nowrap">
            <i class="fa-solid fa-plus"></i><span class="pl-1 hidden sm:inline">Crear organización</span>
          </button>
          {{end}}
        </div>
      </div>
      <div class="flex-1 overflow-y-auto -mx-1 px-1 pb-4" id="orgTable"></div>
    </div>

    <div id="orgDetail" class="w-full lg:w-1/3 bg-light-4 shadow-card rounded-2xl p-6 flex flex-col h-full overflow-y-auto relative animate-fade-in" hidden></div>
  </div>
</div>
{{template "app-end" .}}{{end}}
