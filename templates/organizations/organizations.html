{{define "organizations"}}{{template "app-start" .}}
<div class="orgs-page">
  <div id="orgListPanel" class="page-card page-card--panel orgs-panel">
    <div class="list-toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="Buscar por nombre o correo..." autocomplete="off" />
      </div>
      {{if .Can "Organizations.Update"}}
      <button id="addOrgBtn" type="button" class="btn btn--primary">
        <i class="fa-solid fa-plus"></i><span class="orgs-panel__add-text">Crear organización</span>
      </button>
      {{end}}
    </div>
    <div class="orgs-panel__table" id="orgTable"></div>
  </div>

  <div id="orgDetail" class="page-card org-detail" hidden></div>
</div>
{{template "app-end" .}}{{end}}
