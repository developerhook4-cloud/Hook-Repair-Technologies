{{define "organizations"}}{{template "app-start" .}}
<div class="orgs-page">
  <div class="orgs-page__inner">
    <div id="orgListPanel" class="orgs-panel">
      <div class="orgs-panel__head">
        <h2 class="heading-6">Organizaciones</h2>
        <div class="orgs-panel__tools">
          <div class="orgs-search">
            <input id="search" type="text" placeholder="Buscar por nombre o correo..." autocomplete="off" class="form-field__input orgs-search__input" />
            <i class="fa-solid fa-search"></i>
          </div>
          {{if .Can "Organizations.Update"}}
          <button id="addOrgBtn" type="button" class="btn btn--primary-dark btn--lg orgs-panel__add">
            <i class="fa-solid fa-plus"></i><span class="orgs-panel__add-text">Crear organización</span>
          </button>
          {{end}}
        </div>
      </div>
      <div class="orgs-panel__table" id="orgTable"></div>
    </div>

    <div id="orgDetail" class="org-detail" hidden></div>
  </div>
</div>
{{template "app-end" .}}{{end}}
