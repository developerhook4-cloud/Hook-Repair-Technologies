{{define "sidebar"}}
{{/* Menú lateral de Configuración / Inventario (core/layout.js lo colapsa). */}}
<aside id="hook-sidebar" class="sidebar">
  <div class="sidebar__head">
    <div data-sb-text class="sidebar__title">
      <i class="fa-solid fa-{{.Icon}}"></i>
      <span>{{.Title}}</span>
    </div>
    <button type="button" data-sidebar-toggle class="sidebar__toggle" aria-label="Colapsar menú">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
  </div>

  <ul class="sidebar__menu">
    {{range .Items}}
    <li data-sb-item class="sidebar__item{{if .Active}} is-active{{end}}">
      {{if .Subs}}
      <div data-sb-row class="sidebar__row" title="{{.Label}}">
        <span class="sidebar__row-label">
          <i class="sidebar__icon fa-solid fa-{{.Icon}}"></i>
          <span data-sb-text>{{.Label}}</span>
        </span>
        <i data-sb-text data-sb-chevron class="sidebar__chevron fa-solid fa-chevron-down{{if .Expanded}} is-open{{end}}"></i>
      </div>
      <ul data-sb-subs class="sidebar__subs" {{if not .Expanded}}hidden{{end}}>
        {{range .Subs}}
        <li><a href="{{.Route}}" class="sidebar__sub{{if .Active}} is-active{{end}}">{{.Label}}</a></li>
        {{end}}
      </ul>
      {{else}}
      <a href="{{.Route}}" data-sb-row class="sidebar__row" title="{{.Label}}">
        <span class="sidebar__row-label">
          <i class="sidebar__icon fa-solid fa-{{.Icon}}"></i>
          <span data-sb-text>{{.Label}}</span>
        </span>
      </a>
      {{end}}
    </li>
    {{end}}
  </ul>
</aside>
{{end}}
