{{define "userbar"}}
{{/* Barra de arriba: solo la cuenta del usuario (igual que Avante). */}}
<div class="userbar-outer">
  <header class="userbar-row">
    <div class="userbar" id="userbar">
      <button type="button" class="userbar__trigger" aria-haspopup="true" aria-expanded="false">
        <span class="userbar__avatar">{{initials .User.Name}}</span>
        <span class="userbar__name">{{.User.Name}}</span>
        <i class="fa-solid fa-chevron-down userbar__caret"></i>
      </button>
      <div class="userbar__menu">
        <div class="userbar__head">
          <span class="userbar__avatar userbar__avatar--lg">{{initials .User.Name}}</span>
          <div class="userbar__who">
            <div class="userbar__who-name">{{.User.Name}}</div>
            <div class="userbar__who-email">{{.User.Email}}</div>
            <span class="userbar__role">{{.User.Role}}</span>
          </div>
        </div>
        <a href="/settings/profile" class="userbar__link"><i class="fa-solid fa-user"></i>Mi perfil</a>
        <a href="/settings" class="userbar__link"><i class="fa-solid fa-gear"></i>Configuración</a>
        <div class="userbar__divider"></div>
        <a href="/logout" data-logout class="userbar__link userbar__link--logout"><i class="fa-solid fa-right-from-bracket"></i>Cerrar sesión</a>
      </div>
    </div>
  </header>
</div>
{{end}}
